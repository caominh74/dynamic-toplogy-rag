[project]
name = "dynamic-topology-rag"
version = "0.1.0"
description = "A topology-based agentic RAG proof of concept"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm[mcp]>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
